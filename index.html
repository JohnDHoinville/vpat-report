<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility Testing Platform</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        // Automatic redirect to modern dashboard
        console.log('🔄 Redirecting to modern dashboard...');
        setTimeout(() => {
            window.location.replace('/dashboard/');
        }, 1500);
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Accessibility Testing Platform</h2>
        <p>Redirecting to modern dashboard...</p>
        <p><small>If not redirected automatically, <a href="/dashboard/" style="color: #fff; text-decoration: underline;">click here</a></small></p>
    </div>
</body>
</html>
