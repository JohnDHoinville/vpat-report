<!DOCTYPE html>
<html>
<head>
    <title>Debug Frontend API Issue</title>
    <style>
        body { font-family: monospace; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; background: #f9f9f9; }
        .error { background: #ffebee; border-color: #f44336; }
        .success { background: #e8f5e9; border-color: #4caf50; }
    </style>
</head>
<body>
    <h1>Debug: Requirements with Missing URLs</h1>
    <p>This tool helps debug why requirements show "No test instances found" in the UI.</p>
    
    <div id="results"></div>
    
    <script>
        const API_BASE = 'http://localhost:3001/api';
        const SESSION_ID = '881501dd-b5d0-45fb-af03-b36a2a3a943d'; // Latest session
        const PROBLEM_REQUIREMENTS = ['1.3.1', '1.3.2', '1.3.3', '2.4.2'];
        
        function addResult(title, content, isError = false) {
            const div = document.createElement('div');
            div.className = `result ${isError ? 'error' : 'success'}`;
            div.innerHTML = `<h3>${title}</h3><pre>${content}</pre>`;
            document.getElementById('results').appendChild(div);
        }
        
        async function testAPI() {
            try {
                // Test 1: Check if test instances API works
                addResult('Test 1: API Health Check', 'Testing API connectivity...');
                
                try {
                    const response = await fetch(`${API_BASE}/test-instances?session_id=${SESSION_ID}&limit=5`);
                    const data = await response.json();
                    
                    if (response.status === 401) {
                        addResult('Test 1 Result: Authentication Required', 
                            'API requires authentication. This explains why frontend might not be getting data.\n' +
                            'Response: ' + JSON.stringify(data, null, 2), true);
                    } else if (response.ok) {
                        addResult('Test 1 Result: API Working', 
                            `Found ${data.data?.length || 0} test instances\n` +
                            'Sample response: ' + JSON.stringify(data, null, 2));
                    } else {
                        addResult('Test 1 Result: API Error', 
                            `Status: ${response.status}\n` +
                            'Response: ' + JSON.stringify(data, null, 2), true);
                    }
                } catch (error) {
                    addResult('Test 1 Result: Connection Failed', 
                        'Cannot connect to API: ' + error.message, true);
                }
                
                // Test 2: Check session exists
                addResult('Test 2: Session Check', `Checking if session ${SESSION_ID} exists...`);
                
                // Test 3: Direct database verification
                addResult('Test 3: Database Verification', 
                    'According to direct database query:\n' +
                    '- Requirements 1.3.1, 1.3.2, 1.3.3, 2.4.2 each have 14 test instances\n' +
                    '- Each has 14 unique URLs\n' +
                    '- Session ID: ' + SESSION_ID + '\n' +
                    '- All data exists in database');
                
                // Test 4: Frontend diagnosis
                addResult('Test 4: Likely Frontend Issues', 
                    'Possible causes:\n' +
                    '1. Authentication failure (most likely)\n' +
                    '2. Frontend looking at wrong session ID\n' +
                    '3. API response format mismatch\n' +
                    '4. JavaScript errors preventing data loading\n' +
                    '5. Cached old data\n\n' +
                    'Next steps:\n' +
                    '- Check browser console for API errors\n' +
                    '- Verify session ID in Network tab\n' +
                    '- Clear browser cache\n' +
                    '- Check if user is logged in');
                
            } catch (error) {
                addResult('Diagnostic Error', error.message, true);
            }
        }
        
        // Run diagnostics
        testAPI();
    </script>
</body>
</html>
