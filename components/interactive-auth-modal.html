<!-- Interactive Authentication Modal -->
<div x-show="showInteractiveAuthModal" 
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4"
     @click.self="showInteractiveAuthModal = false">
    
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
        <!-- Header -->
        <div class="px-6 py-4 border-b border-gray-200">
            <div class="flex justify-between items-center">
                <div>
                    <h3 class="text-lg font-semibold text-gray-900">🔐 Login & Test</h3>
                    <p class="text-sm text-gray-600 mt-1">Authenticate and run accessibility tests</p>
                </div>
                <button @click="showInteractiveAuthModal = false" 
                        class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Content -->
        <div class="px-6 py-4">
            <!-- Status Display -->
            <div x-show="!interactiveAuthInProgress" class="space-y-4">
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <div class="flex items-start">
                        <i class="fas fa-info-circle text-blue-600 mt-1 mr-3"></i>
                        <div>
                            <h4 class="font-medium text-blue-900">How this works:</h4>
                            <ul class="text-sm text-blue-800 mt-2 space-y-1">
                                <li>• Browser opens with your login page</li>
                                <li>• You login manually with your credentials</li>
                                <li>• Tests run automatically with fresh authentication</li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="text-sm text-gray-600">
                    <strong>Selected session:</strong> 
                    <span x-text="currentSession?.name || 'None selected'"></span>
                </div>
            </div>

            <!-- Progress Display -->
            <div x-show="interactiveAuthInProgress" class="space-y-4">
                <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                    <div class="flex items-center">
                        <i class="fas fa-spinner fa-spin text-yellow-600 mr-3"></i>
                        <div>
                            <h4 class="font-medium text-yellow-900">Authentication in progress...</h4>
                            <p class="text-sm text-yellow-800 mt-1" x-text="interactiveAuthMessage"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Error Display -->
            <div x-show="interactiveAuthError" class="mt-4">
                <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                    <div class="flex items-start">
                        <i class="fas fa-exclamation-triangle text-red-600 mt-1 mr-3"></i>
                        <div>
                            <h4 class="font-medium text-red-900">Error</h4>
                            <p class="text-sm text-red-800 mt-1" x-text="interactiveAuthError"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="px-6 py-4 border-t border-gray-200 flex justify-end space-x-3">
            <button @click="showInteractiveAuthModal = false"
                    :disabled="interactiveAuthInProgress"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed">
                Cancel
            </button>
            <button @click="startInteractiveAuth()"
                    :disabled="!currentSession || interactiveAuthInProgress"
                    class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed flex items-center">
                <i class="fas fa-browser mr-2" x-show="!interactiveAuthInProgress"></i>
                <i class="fas fa-spinner fa-spin mr-2" x-show="interactiveAuthInProgress"></i>
                <span x-show="!interactiveAuthInProgress">Open Browser & Login</span>
                <span x-show="interactiveAuthInProgress">Authenticating...</span>
            </button>
        </div>
    </div>
</div>
